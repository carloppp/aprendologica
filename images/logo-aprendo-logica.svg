<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 520" role="img" aria-labelledby="title description">
  <title id="title">Aprendo Lógica</title>
  <desc id="description">Logotipo Aprendo Lógica. La A se forma con cuatro piezas de rompecabezas celeste, amarilla, lila y azul marino.</desc>
  <defs>
    <style>
      .join { stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .aprendo { fill: #06295a; font-family: "Arial Rounded MT Bold", "Fredoka", "Trebuchet MS", sans-serif; font-size: 190px; font-weight: 900; letter-spacing: -12px; }
      .logica { fill: #ffda70; font-family: "Arial Rounded MT Bold", "Fredoka", "Trebuchet MS", sans-serif; font-size: 72px; font-weight: 900; letter-spacing: 17px; }
    </style>
  </defs>

  <!-- A / isotipo. Las piezas se mantienen separadas para poder editarlas. -->
  <g id="isotipo" transform="translate(20 18)">
    <path class="join" fill="#7fc4ef"
      d="M239 23 C213 23 192 37 180 61 L107 201 L218 228 C207 239 201 253 203 268 C206 296 231 315 259 311 C287 307 306 282 302 254 C301 245 297 237 291 230 L372 194 L526 128 L500 63 C491 38 469 23 442 23 Z"/>

    <path class="join" fill="#d385e7"
      d="M107 201 L217 228 C229 231 230 238 221 246 C209 257 204 272 207 287 C212 315 239 333 267 327 C295 322 312 295 307 267 C305 256 300 247 292 240 L354 256 L415 445 L150 445 C108 445 78 405 92 366 Z"/>

    <path class="join" fill="#ffda70"
      d="M371 193 L526 128 L617 371 L557 371 C562 362 564 351 561 340 C555 314 529 298 503 305 C477 311 461 337 468 363 C469 366 470 369 472 371 L403 371 L348 214 C345 204 353 196 365 196 Z"/>

    <path fill="#fff"
      d="M208 282 C224 331 251 358 300 374 C251 390 224 417 208 466 C192 417 165 390 116 374 C165 358 192 331 208 282 Z"/>

    <path class="join" fill="#06295a"
      d="M315 366 L430 366 C423 357 420 347 422 336 C425 313 446 297 469 300 C492 303 508 324 505 347 C504 354 501 360 497 366 L536 366 C532 358 531 350 533 341 C537 319 558 304 580 309 C602 313 617 334 612 356 C611 360 610 363 608 366 L639 366 L672 433 C685 459 666 489 637 489 L453 489 C418 489 390 461 390 426 L315 426 C298 426 284 413 284 396 C284 379 298 366 315 366 Z"/>
  </g>

  <!-- El isotipo funciona como la A inicial: A + prendo -->
  <text class="aprendo" x="592" y="366">prendo</text>
  <text class="logica" x="735" y="468">LÓGICA</text>
</svg>
